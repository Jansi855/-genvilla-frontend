name: Frontend CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: https://api.genvilla.in
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: node --test tests/*.mjs
      - name: Build production frontend
        run: npm run build
      - name: Install infrastructure dependencies
        run: npm ci --prefix infra
      - name: Synthesize infrastructure
        run: npm run synth --prefix infra -- --context imageTag=ci

  arm64-image:
    name: Build ARM64 production image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.genvilla.in
          cache-from: type=gha
          cache-to: type=gha,mode=max
