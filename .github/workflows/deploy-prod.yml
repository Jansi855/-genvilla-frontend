name: Deploy production frontend
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: frontend-production
  cancel-in-progress: false
env:
  AWS_REGION: ap-south-1
  RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/*.mjs
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::013565030464:role/genvilla-frontend-github-prod-deploy
          aws-region: ap-south-1
      - name: Read asset infrastructure
        run: |
          aws cloudformation describe-stacks --stack-name GenvillaFrontendFoundation > /tmp/foundation.json
          echo "ASSETS_BUCKET=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="AssetsBucket") | .OutputValue' /tmp/foundation.json)" >> "$GITHUB_ENV"
          echo "ASSETS_URL=$(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="AssetsUrl") | .OutputValue' /tmp/foundation.json)" >> "$GITHUB_ENV"
      - name: Publish versioned assets
        run: aws s3 sync public/ "s3://$ASSETS_BUCKET/releases/$RELEASE_ID/" --cache-control 'public,max-age=31536000,immutable'
      - uses: aws-actions/amazon-ecr-login@v2.1.6
        id: ecr
      - name: Build and publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PROPERTY_VIDEO_URL: ${{ vars.PROPERTY_VIDEO_URL }}
          HOME_VIDEO_URL: ${{ vars.HOME_VIDEO_URL }}
        run: |
          IMAGE="$REGISTRY/genvilla-frontend:$RELEASE_ID"
          if ! aws ecr describe-images --repository-name genvilla-frontend --image-ids "imageTag=$RELEASE_ID" >/dev/null 2>&1; then
            docker build --platform linux/amd64 --pull --build-arg "NEXT_PUBLIC_ASSET_BASE_URL=$ASSETS_URL/releases/$RELEASE_ID" --build-arg "NEXT_PUBLIC_PROPERTY_VIDEO_URL=$PROPERTY_VIDEO_URL" --build-arg "NEXT_PUBLIC_HOME_VIDEO_URL=$HOME_VIDEO_URL" -t "$IMAGE" .
            docker push "$IMAGE"
          fi
      - run: npm ci --prefix infra
      - run: npm run synth --prefix infra -- --context "imageTag=$RELEASE_ID"
      - run: npm run diff --prefix infra -- GenvillaFrontendProd --context "imageTag=$RELEASE_ID"
      - run: npm run deploy:prod --prefix infra -- --context "imageTag=$RELEASE_ID"
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors https://genvilla.in/ -o /dev/null
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors https://www.genvilla.in/ -o /dev/null
